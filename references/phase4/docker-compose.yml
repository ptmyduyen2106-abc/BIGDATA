services:

  # =========================
  # HADOOP NAMENODE
  # =========================
  namenode:
    image: apache/hadoop:3.5.0
    container_name: hadoop-namenode
    hostname: namenode
    user: root

    ports:
      - "9870:9870"
      - "8020:8020"

    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    command:
      - /bin/bash
      - -c
      - |
        if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
          hdfs namenode -format -force
        fi
        exec hdfs namenode

    networks:
      - bigdata


  # =========================
  # HADOOP DATANODE
  # =========================
  datanode:
    image: apache/hadoop:3.5.0
    container_name: hadoop-datanode
    hostname: datanode

    user: root

    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    depends_on:
      - namenode

    command:
      - /bin/bash
      - -c
      - |
        exec hdfs datanode

    networks:
      - bigdata


  # =========================
  # KAFKA
  # =========================
  kafka:
    image: apache/kafka:4.2.1
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Development
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - bigdata

  # =========================
  # SPARK
  # =========================
  spark:
    image: apache/spark:4.2.0-python3
    container_name: spark
    hostname: spark

    ports:
      - "4040:4040"
      - "8080:8080"

    volumes:
      - ./src:/opt/spark-apps
      - ./requirements.txt:/opt/requirements.txt:ro
      - ./config/hadoop/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro

    depends_on:
      - namenode
      - datanode
      - kafka

    command:
      - /bin/bash
      - -c
      - |
        pip3 install --target /tmp/python-deps -r /opt/requirements.txt
        export PYTHONPATH=/tmp/python-deps:$${PYTHONPATH}
        tail -f /dev/null

    networks:
      - bigdata

  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7
    container_name: redis
    hostname: redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    networks:
      - bigdata

  # =========================
  # MONGODB
  # =========================
  mongodb:
    image: mongo:8
    container_name: mongodb
    hostname: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - bigdata

# =========================
# VOLUMES
# =========================
volumes:
  namenode_data:
  datanode_data:
  kafka_data:
  redis_data:
  mongodb_data:

# =========================
# NETWORK
# =========================
networks:
  bigdata:
    driver: bridge