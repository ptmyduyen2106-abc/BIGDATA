name: retailrocket17
x-app: &app
  image: retailrocket-phase17:1.0
  build: .
  environment: &environment
    OUTPUT_ROOT: /app/outputs
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    MONGO_URI: mongodb://mongodb:27017
    REDIS_URL: redis://redis:6379/0
    HADOOP_CONF_DIR: /app/config/hadoop
    LAKE_BASE_URI: hdfs://namenode:8020/ecommerce/runs
    SPARK_LOCAL_IP: 127.0.0.1
  volumes:
    - ./data:/app/data
    - ./outputs:/app/outputs
    - ivy_cache:/root/.ivy2
  depends_on:
    kafka: {condition: service_healthy}
    mongodb: {condition: service_healthy}
    redis: {condition: service_healthy}
    namenode: {condition: service_healthy}
    datanode: {condition: service_healthy}
services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 40
  namenode:
    image: apache/hadoop:3.5.0
    user: root
    hostname: namenode
    ports: ["127.0.0.1:19870:9870"]
    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: [bash, -c, "if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then hdfs namenode -format -force; fi; exec hdfs namenode"]
    healthcheck:
      test: [CMD-SHELL, "hdfs dfsadmin -safemode get 2>/dev/null | grep -q 'OFF'"]
      interval: 5s
      timeout: 15s
      retries: 60
      start_period: 20s
  datanode:
    image: apache/hadoop:3.5.0
    user: root
    hostname: datanode
    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: [hdfs, datanode]
    depends_on: [namenode]
    healthcheck:
      test: [CMD-SHELL, "hdfs dfsadmin -report 2>/dev/null | grep -Fq 'Live datanodes (1)'"]
      interval: 5s
      timeout: 15s
      retries: 60
  mongodb:
    image: mongo:8.0.9
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 40
  redis:
    image: redis:7.4.3
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 40
  app:
    <<: *app
  api:
    <<: *app
    command: [uvicorn, service.app:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]
    volumes:
      - ./outputs:/app/outputs:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live',timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20
  job-worker:
    <<: *app
    profiles: [orchestration]
    command: [uvicorn, pipeline.job_server:app, --host, 0.0.0.0, --port, "9000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9000/health',timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
  airflow:
    image: apache/airflow:2.10.5-python3.11
    profiles: [orchestration]
    user: "50000:0"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/state/logs
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      JOB_WORKER_URL: http://job-worker:9000
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - airflow_state:/opt/airflow/state
    ports: ["127.0.0.1:${AIRFLOW_PORT:-8088}:8080"]
    command: [bash, /opt/airflow/dags/start_airflow.sh]
    depends_on:
      job-worker: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    profiles: [orchestration]
    user: "0:0"
    volumes: [airflow_state:/opt/airflow/state]
    command: [bash, -c, "mkdir -p /opt/airflow/state/logs && chown -R 50000:0 /opt/airflow/state"]
volumes:
  kafka_data:
  ivy_cache:
  namenode_data:
  datanode_data:
  mongo_data:
  redis_data:
  airflow_state:
